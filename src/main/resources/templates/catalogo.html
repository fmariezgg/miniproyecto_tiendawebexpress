<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Catálogo - Tienda Web Express</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#006972",
              secondary: "#306669",
              surface: "#fff9ef",
              "on-surface": "#1d1b16",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-surface text-on-surface">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 p-4">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <h1 class="text-2xl font-bold text-primary">Tienda Express</h1>
        <div class="hidden md:flex gap-8 items-center">
          <a href="/" class="hover:text-primary">Inicio</a>
          <a href="/catalogo" class="text-primary font-bold">Catálogo</a>
          <a href="/pedido/formulario" class="button-primary">Hacer Pedido</a>
        </div>
        <button id="menu-toggle" class="md:hidden">
          <span class="material-symbols-outlined text-primary">menu</span>
        </button>
      </div>
      <div id="mobile-menu" class="hidden md:hidden bg-white p-4">
        <a href="/" class="block py-2">Inicio</a>
        <a
          href="/pedido/formulario"
          class="button-primary w-full text-center inline-block mt-2"
          >Hacer Pedido</a
        >
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-12">
      <div class="grid md:grid-cols-4 gap-8">
        <!-- FILTROS -->
        <div class="md:col-span-1">
          <div class="bg-white p-6 rounded-lg border border-gray-200">
            <h2 class="font-bold text-lg mb-6 text-primary">Filtros</h2>
            <div class="mb-8">
              <h3 class="font-bold mb-4">Categorías</h3>
              <div class="space-y-2">
                <button
                  class="filter-btn active"
                  data-category="0"
                  onclick="filtrarPorCategoria(0)"
                >
                  Todas
                </button>
                <button
                  th:each="cat : ${categorias}"
                  class="filter-btn"
                  th:data-category="${cat.id}"
                  th:text="${cat.nombre}"
                  th:onclick="'filtrarPorCategoria(' + ${cat.id} + ')'"
                ></button>
              </div>
            </div>
          </div>
        </div>

        <div class="md:col-span-3">
          <h1 class="text-3xl font-bold text-primary mb-8">
            Catálogo de Productos
          </h1>

          <div
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
            id="productos-grid"
          >
            <div
              th:each="producto : ${productos}"
              class="product-card"
              th:data-categoria="${producto.categoria.id}"
            >
              <div
                class="bg-gray-200 h-48 flex items-center justify-center overflow-hidden"
              >
                <img
                  th:if="${producto.imagen != null and !producto.imagen.isEmpty()}"
                  th:src="@{${producto.imagen}}"
                  class="w-full h-full object-cover"
                />
                <span
                  th:unless="${producto.imagen != null and !producto.imagen.isEmpty()}"
                  class="material-symbols-outlined text-4xl text-gray-400"
                  >image</span
                >
              </div>
              <div class="p-4">
                <h3 class="font-bold text-lg mb-2" th:text="${producto.nombre}">
                  Nombre
                </h3>
                <p
                  class="text-gray-600 text-sm mb-3"
                  th:text="${producto.descripcion}"
                >
                  Descripción
                </p>
                <p
                  class="text-primary font-bold text-xl mb-4"
                  th:text="'$' + ${producto.precio}"
                >
                  $0.00
                </p>
                <div class="flex gap-2">
                  <a
                    th:href="@{/producto/{id}(id=${producto.id})}"
                    class="flex-1 text-center bg-primary text-white py-2 rounded"
                    >Ver Detalle</a
                  >
                </div>
              </div>
            </div>

            <div
              id="mensaje-vacio"
              class="col-span-full text-center py-8 hidden"
            >
              <p class="text-gray-500">No hay productos en esta categoría</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
  </body>
</html>
