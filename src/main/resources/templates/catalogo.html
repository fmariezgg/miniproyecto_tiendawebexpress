<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Catalogo - Tienda Web Express</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
          <img th:src="@{/images/logo.svg}" alt="Logo" width="30" height="30" />
          <span>Tienda Express</span>
        </a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navCatalogo" type="button">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navCatalogo">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
            <li class="nav-item"><a class="nav-link active" href="/catalogo">Catalogo</a></li>
            <li class="nav-item"><a class="nav-link" href="/carrito">Carrito</a></li>
            <li class="nav-item"><a class="btn btn-warning" href="/pedido/formulario">Hacer pedido</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-lg-5">
      <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div class="row g-4">
        <aside class="col-lg-3">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5 mb-3">Categorias</h2>
              <div class="d-grid gap-2">
                <button class="btn btn-outline-primary filter-btn active" data-category="0" onclick="filtrarPorCategoria(0)">Todas</button>
                <button
                  th:each="cat : ${categorias}"
                  class="btn btn-outline-primary filter-btn"
                  th:data-category="${cat.id}"
                  th:text="${cat.nombre}"
                  th:onclick="'filtrarPorCategoria(' + ${cat.id} + ')'"
                ></button>
              </div>
            </div>
          </div>
        </aside>

        <section class="col-lg-9">
          <h1 class="h3 mb-4">Catalogo de productos</h1>
          <div class="row g-4" id="productos-grid">
            <div th:each="producto : ${productos}" class="col-md-6 col-xl-4 product-card" th:data-categoria="${producto.categoria.id}">
              <div class="card h-100 shadow-sm">
                <img
                  alt="Producto"
                  class="card-img-top"
                  th:if="${producto.imagen != null and !producto.imagen.isEmpty()}"
                  th:src="@{${producto.imagen}}"
                  style="height: 220px; object-fit: cover"
                />
                <div class="card-body d-flex flex-column">
                  <h3 class="h5" th:text="${producto.nombre}">Nombre</h3>
                  <p class="text-muted small" th:text="${producto.descripcion}">Descripcion</p>
                  <p class="fw-bold text-primary mb-2" th:text="'C$ ' + ${producto.precio}">C$ 0.00</p>
                  <p class="small mb-3" th:text="${producto.stock > 0 ? 'Stock: ' + producto.stock : 'Agotado'}">Stock</p>
                  <div class="d-grid gap-2 mt-auto">
                    <a class="btn btn-outline-primary" th:href="@{/producto/{id}(id=${producto.id})}">Ver detalle</a>
                    <form action="/carrito/agregar" class="row g-2" method="post">
                      <input name="productoId" th:value="${producto.id}" type="hidden" />
                      <input name="redirectTo" type="hidden" value="/catalogo" />
                      <div class="col-5">
                        <input class="form-control" min="1" name="cantidad" th:max="${producto.stock > 0 ? producto.stock : 1}" th:value="${producto.stock > 0 ? 1 : 0}" type="number" />
                      </div>
                      <div class="col-7 d-grid">
                        <button class="btn btn-primary" th:disabled="${producto.stock <= 0}" type="submit">
                          <span th:text="${producto.stock > 0 ? 'Agregar' : 'Sin stock'}">Agregar</span>
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="alert alert-info mt-4 d-none" id="mensaje-vacio">No hay productos en esta categoria.</div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
  </body>
</html>
