<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title th:text="${producto.nombre} + ' - Tienda Web Express'">Detalle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
          <img th:src="@{/images/logo.svg}" alt="Logo" width="30" height="30" />
          <span>Tienda Express</span>
        </a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navDetalle" type="button">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navDetalle">
          <ul class="navbar-nav ms-auto gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
            <li class="nav-item"><a class="nav-link active" href="/catalogo">Catalogo</a></li>
            <li class="nav-item"><a class="nav-link" href="/carrito">Carrito</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5" th:if="${producto != null}">
      <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card shadow-sm">
            <img
              alt="Producto"
              class="card-img-top"
              th:if="${producto.imagen != null and !producto.imagen.isEmpty()}"
              th:src="@{${producto.imagen}}"
              style="height: 420px; object-fit: cover"
            />
            <div class="card-body" th:unless="${producto.imagen != null and !producto.imagen.isEmpty()}">
              <p class="text-muted mb-0">Imagen no disponible</p>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <span class="badge text-bg-secondary mb-2" th:text="${producto.categoria.nombre}">Categoria</span>
          <h1 class="display-6 fw-bold" th:text="${producto.nombre}">Nombre</h1>
          <p class="h4 text-primary mb-3" th:text="'C$ ' + ${producto.precio}">C$ 0.00</p>
          <p class="text-muted" th:text="${producto.descripcion}">Descripcion</p>

          <div class="alert" th:classappend="${producto.stock > 0 ? ' alert-success' : ' alert-danger'}">
            <span th:text="${producto.stock > 0 ? 'Disponible: ' + producto.stock + ' unidades' : 'Producto agotado'}">Stock</span>
          </div>

          <form action="/carrito/agregar" class="row g-3" method="post">
            <input name="productoId" th:value="${producto.id}" type="hidden" />
            <input name="redirectTo" th:value="@{/producto/{id}(id=${producto.id})}" type="hidden" />

            <div class="col-sm-4">
              <label class="form-label" for="cantidad">Cantidad</label>
              <input
                class="form-control"
                id="cantidad"
                min="1"
                name="cantidad"
                th:max="${producto.stock > 0 ? producto.stock : 1}"
                type="number"
                value="1"
              />
            </div>

            <div class="col-12 d-grid gap-2 d-sm-flex">
              <button class="btn btn-primary" th:disabled="${producto.stock <= 0}" type="submit">
                <span th:text="${producto.stock > 0 ? 'Agregar al carrito' : 'Sin stock'}">Agregar al carrito</span>
              </button>
              <a class="btn btn-outline-secondary" href="/catalogo">Volver al catalogo</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <main class="container py-5" th:unless="${producto != null}">
      <div class="alert alert-warning">No se encontro el producto solicitado.</div>
      <a class="btn btn-primary" href="/catalogo">Ir al catalogo</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
