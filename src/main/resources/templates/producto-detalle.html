<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title th:text="${producto.nombre} + ' - Tienda Web Express'">
      Detalle
    </title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#006972",
              secondary: "#306669",
              surface: "#fff9ef",
              "on-surface": "#1d1b16",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-surface text-on-surface">
    <header class="bg-white border-b border-gray-200 p-4">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <h1 class="text-2xl font-bold text-primary">Tienda Express</h1>
        <div class="hidden md:flex gap-8 items-center">
          <a href="/" class="hover:text-primary">Inicio</a>
          <a href="/catalogo" class="text-primary font-bold">Catálogo</a>
          <a href="/pedido/formulario" class="button-primary py-2 px-4 rounded"
            >Hacer Pedido</a
          >
        </div>
        <button id="menu-toggle" class="md:hidden">
          <span class="material-symbols-outlined text-primary">menu</span>
        </button>
      </div>
      <div id="mobile-menu" class="hidden md:hidden bg-white p-4">
        <a href="/catalogo" class="block py-2">Catálogo</a>
        <a
          href="/pedido/formulario"
          class="button-primary w-full mt-2 text-center inline-block"
          >Hacer Pedido</a
        >
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-12">
      <div class="grid md:grid-cols-2 gap-12">
        <div
          class="bg-gray-200 rounded-lg h-96 flex items-center justify-center overflow-hidden"
        >
          <img
            th:if="${producto.imagen != null and !producto.imagen.isEmpty()}"
            th:src="@{${producto.imagen}}"
            class="w-full h-full object-cover"
          />
          <span
            th:unless="${producto.imagen != null and !producto.imagen.isEmpty()}"
            class="material-symbols-outlined text-6xl text-gray-400"
            >image</span
          >
        </div>

        <div>
          <div class="mb-4">
            <span
              class="text-sm text-secondary font-bold bg-secondary bg-opacity-10 px-3 py-1 rounded"
              th:text="${producto.categoria.nombre}"
              >Categoría</span
            >
          </div>

          <h1
            class="text-4xl font-bold text-on-surface mb-2"
            th:text="${producto.nombre}"
          >
            Nombre
          </h1>

          <div class="mb-6">
            <p
              class="text-5xl font-bold text-primary"
              th:text="'$' + ${producto.precio}"
            >
              $0.00
            </p>
          </div>

          <div class="mb-6 p-4 rounded-lg bg-gray-50">
            <p
              th:if="${producto.stock > 0}"
              class="text-green-600 font-bold"
              th:text="'En stock (' + ${producto.stock} + ' disponibles)'"
            ></p>
            <p th:unless="${producto.stock > 0}" class="text-red-600 font-bold">
              Agotado temporalmente
            </p>
          </div>

          <div class="mb-8 pb-8 border-b border-gray-200">
            <h3 class="font-bold text-lg mb-3">Descripción</h3>
            <p
              class="text-gray-700 leading-relaxed"
              th:text="${producto.descripcion}"
            >
              Descripción
            </p>
          </div>

          <form action="/pedido/crear" method="POST" class="space-y-4">
            <input type="hidden" name="productoId" th:value="${producto.id}" />

            <p class="text-sm text-gray-600 mb-2">Cantidad</p>
            <div class="cantidad-control mb-4">
              <button type="button" onclick="disminuir()">−</button>
              <input
                type="number"
                name="cantidad"
                id="cantidad"
                value="1"
                min="1"
                th:max="${producto.stock > 0 ? producto.stock : 1}"
              />
              <button type="button" onclick="aumentar()">+</button>
            </div>

            <button
              type="button"
              onclick="irAlFormularioConDatos()"
              class="w-full button-primary py-4 text-lg rounded"
            >
              Ir al Formulario Principal
            </button>
          </form>
        </div>
      </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
  </body>
</html>
