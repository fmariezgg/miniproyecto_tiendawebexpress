<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Hacer Pedido - Tienda Web Express</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#006972",
              surface: "#fff9ef",
              "on-surface": "#1d1b16",
              error: "#ba1a1a",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-surface text-on-surface">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 p-4">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <h1 class="text-2xl font-bold text-primary">Tienda Express</h1>
        <div class="hidden md:flex gap-8 items-center">
          <a href="/" class="hover:text-primary">Inicio</a>
          <a href="/catalogo" class="hover:text-primary">Catálogo</a>
        </div>
        <button id="menu-toggle" class="md:hidden">
          <span class="material-symbols-outlined text-primary">menu</span>
        </button>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-12">
      <div class="grid lg:grid-cols-3 gap-12">
        <div class="lg:col-span-2">
          <div class="bg-white p-8 rounded-lg border border-gray-200">
            <h1 class="text-3xl font-bold text-primary mb-8">
              Completa tu Pedido
            </h1>

            <form
              id="formulario-pedido"
              action="/pedido/crear"
              method="POST"
              onsubmit="return validarFormulario();"
            >
              <fieldset class="mb-10 pb-10 border-b border-gray-200">
                <legend class="text-xl font-bold mb-6">
                  1. Información Personal
                </legend>
                <div class="mb-6">
                  <label class="block text-sm font-bold mb-2"
                    >Nombre Completo *</label
                  >
                  <input
                    type="text"
                    id="nombre"
                    name="nombreCliente"
                    class="input-field"
                    required
                  />
                  <span class="error-message" id="error-nombre"></span>
                </div>
                <div class="mb-6">
                  <label class="block text-sm font-bold mb-2"
                    >Correo Electrónico *</label
                  >
                  <input
                    type="email"
                    id="correo"
                    name="correo"
                    class="input-field"
                    required
                  />
                  <span class="error-message" id="error-correo"></span>
                </div>
              </fieldset>

              <fieldset class="mb-10 pb-10 border-b border-gray-200">
                <legend class="text-xl font-bold mb-6">
                  2. Selecciona tu Producto
                </legend>
                <div class="mb-6">
                  <label class="block text-sm font-bold mb-2">Producto *</label>
                  <select
                    id="producto"
                    name="productoId"
                    class="input-field"
                    onchange="actualizarResumen()"
                    required
                  >
                    <option value="">-- Selecciona un producto --</option>
                    <option
                      th:each="p : ${productos}"
                      th:value="${p.id}"
                      th:data-precio="${p.precio}"
                      th:data-nombre="${p.nombre}"
                      th:text="${p.nombre} + ' - $' + ${p.precio}"
                    ></option>
                  </select>
                  <span class="error-message" id="error-producto"></span>
                </div>
                <div class="mb-6">
                  <label class="block text-sm font-bold mb-2">Cantidad *</label>
                  <input
                    type="number"
                    id="cantidad"
                    name="cantidad"
                    class="input-field"
                    value="1"
                    min="1"
                    onchange="actualizarResumen()"
                    required
                  />
                </div>
              </fieldset>

              <fieldset class="mb-10">
                <legend class="text-xl font-bold mb-6">
                  3. Notas Adicionales
                </legend>
                <textarea
                  name="comentario"
                  class="input-field"
                  rows="4"
                  placeholder="Dirección de entrega..."
                ></textarea>
              </fieldset>

              <button type="submit" class="w-full button-primary py-3 text-lg">
                Confirmar Pedido
              </button>
            </form>
          </div>
        </div>

        <div class="lg:col-span-1">
          <div
            class="bg-white p-6 rounded-lg border border-gray-200 sticky top-24"
          >
            <h2 class="text-lg font-bold text-primary mb-6">Resumen</h2>
            <div class="mb-6 pb-6 border-b border-gray-200">
              <p id="resumen-nombre" class="font-bold text-sm">
                No seleccionado
              </p>
              <div class="flex justify-between mt-2 text-sm">
                <span id="resumen-cantidad" class="text-gray-600"
                  >Cantidad: 0</span
                >
                <span id="resumen-precio" class="font-bold">$0.00</span>
              </div>
            </div>
            <div class="flex justify-between text-lg">
              <span class="font-bold">Total</span>
              <span id="total-precio" class="font-bold text-primary text-2xl"
                >$0.00</span
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
  </body>
</html>
