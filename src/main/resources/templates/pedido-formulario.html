<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Hacer Pedido - Tienda Web Express</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
          <img th:src="@{/images/logo.svg}" alt="Logo" width="30" height="30" />
          <span>Tienda Express</span>
        </a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navPedido" type="button">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navPedido">
          <ul class="navbar-nav ms-auto gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="/catalogo">Catalogo</a></li>
            <li class="nav-item"><a class="nav-link" href="/carrito">Carrito</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body p-4 p-lg-5">
              <h1 class="h3 mb-4">Completa tu pedido</h1>
              <form id="formulario-pedido" action="/pedido/crear" method="POST" onsubmit="return validarFormulario();">
                <h2 class="h5 mb-3">1. Informacion personal</h2>
                <div class="mb-3">
                  <label class="form-label" for="nombre">Nombre completo *</label>
                  <input type="text" id="nombre" name="nombreCliente" class="form-control" th:value="${nombreCliente}" required />
                  <span class="error-message" id="error-nombre"></span>
                </div>
                <div class="mb-4">
                  <label class="form-label" for="correo">Correo electronico *</label>
                  <input type="email" id="correo" name="correo" class="form-control" th:value="${correo}" required />
                  <span class="error-message" id="error-correo"></span>
                </div>

                <h2 class="h5 mb-3">2. Selecciona tu producto</h2>
                <div class="mb-3">
                  <label class="form-label" for="producto">Producto *</label>
                  <select id="producto" name="productoId" class="form-select" onchange="actualizarResumen()" required>
                    <option value="">-- Selecciona un producto --</option>
                    <option
                      th:each="p : ${productos}"
                      th:if="${p.stock > 0}"
                      th:value="${p.id}"
                      th:selected="${productoSeleccionadoId != null and productoSeleccionadoId == p.id}"
                      th:data-precio="${p.precio}"
                      th:data-nombre="${p.nombre}"
                      th:data-stock="${p.stock}"
                      th:text="${p.nombre} + ' - C$' + ${p.precio} + ' (Stock: ' + ${p.stock} + ')'"
                    ></option>
                    <option
                      th:each="p : ${productos}"
                      th:unless="${p.stock > 0}"
                      th:value="${p.id}"
                      th:data-precio="${p.precio}"
                      th:data-nombre="${p.nombre}"
                      th:data-stock="${p.stock}"
                      th:disabled="true"
                      th:text="${p.nombre} + ' - C$' + ${p.precio} + ' (Agotado)'"
                    ></option>
                  </select>
                  <span class="error-message" id="error-producto"></span>
                  <small class="text-muted" id="stock-disponible">Stock disponible: 0</small>
                </div>
                <div class="mb-4">
                  <label class="form-label" for="cantidad">Cantidad *</label>
                  <input
                    type="number"
                    id="cantidad"
                    name="cantidad"
                    class="form-control"
                    th:value="${cantidadSeleccionada != null ? cantidadSeleccionada : 1}"
                    min="1"
                    onchange="actualizarResumen()"
                    required
                  />
                </div>

                <h2 class="h5 mb-3">3. Notas adicionales</h2>
                <div class="mb-4">
                  <textarea name="comentario" class="form-control" rows="4" placeholder="Direccion de entrega..." th:text="${comentario}"></textarea>
                </div>

                <button id="btn-confirmar-pedido" type="submit" class="btn btn-primary w-100">Confirmar pedido</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-sm sticky-lg-top" style="top: 1rem">
            <div class="card-body">
              <h2 class="h5 mb-3">Resumen</h2>
              <p id="resumen-nombre" class="fw-semibold mb-2">No seleccionado</p>
              <div class="d-flex justify-content-between small mb-3">
                <span id="resumen-cantidad" class="text-muted">Cantidad: 0</span>
                <span id="resumen-precio" class="fw-semibold">C$ 0.00</span>
              </div>
              <hr />
              <div class="d-flex justify-content-between fs-5">
                <span class="fw-bold">Total</span>
                <span id="total-precio" class="fw-bold text-primary">C$ 0.00</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
  </body>
</html>
