<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Tienda Web Express - Inicio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
          <img th:src="@{/images/logo.svg}" alt="Logo" width="30" height="30" />
          <span>Tienda Express</span>
        </a>
        <button
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
          class="navbar-toggler"
          data-bs-target="#navbarNav"
          data-bs-toggle="collapse"
          type="button"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link active" href="/">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="/catalogo">Catalogo</a></li>
            <li class="nav-item"><a class="nav-link" href="/carrito">Carrito</a></li>
            <li class="nav-item"><a class="btn btn-warning" href="/pedido/formulario">Hacer pedido</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="py-5 text-center bg-white border-bottom">
      <div class="container">
        <h1 class="display-6 fw-bold">Bienvenido a Tienda Web Express</h1>
        <p class="lead text-muted">Productos de calidad con una experiencia de compra simple.</p>
        <a class="btn btn-primary btn-lg" href="/catalogo">Ver catalogo</a>
      </div>
    </header>

    <main class="container py-5">
      <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <section>
        <h2 class="h3 mb-4">Productos destacados</h2>
        <div class="row g-4">
          <div class="col-md-6 col-lg-4" th:each="producto, iterStat : ${productos}" th:if="${iterStat.index < 3}">
            <div class="card h-100 shadow-sm">
              <img
                alt="Producto"
                class="card-img-top"
                th:if="${producto.imagen != null and !producto.imagen.isEmpty()}"
                th:src="@{${producto.imagen}}"
                style="height: 220px; object-fit: cover"
              />
              <div class="card-body d-flex flex-column">
                <span class="badge text-bg-secondary mb-2" th:text="${producto.categoria.nombre}">Categoria</span>
                <h3 class="h5" th:text="${producto.nombre}">Nombre</h3>
                <p class="text-primary fw-bold mb-3" th:text="'C$ ' + ${producto.precio}">C$ 0.00</p>
                <div class="d-grid gap-2 mt-auto">
                  <a class="btn btn-outline-primary" th:href="@{/producto/{id}(id=${producto.id})}">Ver detalle</a>
                  <form action="/carrito/agregar" method="post">
                    <input name="productoId" th:value="${producto.id}" type="hidden" />
                    <input name="cantidad" type="hidden" value="1" />
                    <input name="redirectTo" type="hidden" value="/" />
                    <button class="btn btn-primary w-100" th:disabled="${producto.stock <= 0}" type="submit">
                      <span th:text="${producto.stock > 0 ? 'Agregar al carrito' : 'Sin stock'}">Agregar al carrito</span>
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
